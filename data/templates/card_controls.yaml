    - கிரெடிட் கார்டில் ஆன்லைன் பரிவர்த்தனைகளை இயக்கு
    - என் டெபிட் கார்டை தற்காலிகமாக பூட்டுங்கள்
    - என் கார்டில் பிஓஎஸ் பரிவர்த்தனை வரம்பை மாற்றுவது எப்படி
    - கிரெடிட் கார்டை கூகுள் பே வாலட்டுடன் இணைக்கவும்
    - மெய்நிகர் விர்ச்சுவல் கார்டை உருவாக்குவது எப்படி
    - வணிகர் கடையில் என் கார்டு கட்டணம் ஏன் நிராகரிக்கப்பட்டது
    - கிரெடிட் கார்டுக்கு தட்டி செலுத்தும் வசதியை இயக்கு
    - உள்நாட்டு ஏடிஎம் பணப் பரிவர்த்தனையை முடக்கு
    - செயலில் உள்ள டெபிட் கார்டு வரம்புகளைக் காட்டு
    - என் புதிய விர்ச்சுவல் டெபிட் கார்டை செயல்படுத்து
    - ஆன்லைன் ஷாப்பிங்கிற்கான கார்டு வரம்பை அமைப்பது எப்படி
    - செயலியில் டெபிட் கார்டு கட்டுப்பாடுகளை நிர்வகிக்கவும்
    - சர்வதேச பிஓஎஸ் பயன்பாட்டிற்கு கார்டை இயக்கவும்
    - கார்டு ஸ்வைப் பரிவர்த்தனைகளுக்கான அமைப்புகளை மாற்று
    - டேப் டு பே வரம்பை அமைக்கவும்
    - டெபிட் கார்டு பரிவர்த்தனை ஏன் தோல்வியடைந்தது என்று சரிபார்
    - கிரெடிட் கார்டு ஆன்லைன் பயன்பாட்டை தற்காலிகமாக முடக்கு
