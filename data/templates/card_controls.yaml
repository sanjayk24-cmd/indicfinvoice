    templates:
    - டெபிட் கார்டில் சர்வதேச பயன்பாட்டை இயக்குவது எப்படி
    - என் கார்டில் காண்டாக்ட்லெஸ் என்எஃப்சி பரிவர்த்தனைகளை முடக்கு
