  ta:
    templates:
    - என் கணக்கில் சைபர் கிரைம் போலீஸ் பிடி ஏன் போடப்பட்டுள்ளது
    - என் கணக்கு நிதியை யார் முடக்கியது
    - கணக்கில் உள்ள போலீஸ் பிடியை எவ்வாறு அகற்றுவது
    - சிபில் மதிப்பெண்ணில் தவறான கடன் பதிவை நீக்க புகார்
    - கடன் முடித்த பிறகு தடையில்லா சான்றிதழ் என்ஓசி பெறுவது எப்படி
    - வங்கி குறைதீர்ப்பாளரிடம் எவ்வாறு புகார் செய்வது
    - தீர்க்கப்படாத வாடிக்கையாளர் புகாரை மேல்முறையீடு செய்
    - ஆர்பிஐ குறைதீர்ப்பாளர் புகார் தீர்வு காலம் என்ன
    - நீதிமன்ற உத்தரவால் என் கணக்கு முடக்கப்பட்டுள்ளது
    - தாமதமான விசாரணைக்கான இழப்பீட்டை கோருங்கள்
    - நான் செலுத்திய கடனை சிபில் இன்னும் நிலுவையில் காட்டுகிறது
    - சைபர் கிரைம் முடக்கிய கணக்கை மீண்டும் இயக்குவது எப்படி
    - புகாருக்கான குறிப்பு எண்ணைப் பெறுங்கள்
    - சிபிலில் தவறான மதிப்பீட்டை எதிர்த்து புகார் செய்
    - முதன்மை நோடல் அதிகாரிக்கு புகாரை அனுப்புங்கள்
    - சேமிப்புக் கணக்கில் வரித்துறை பிடி ஏன் போடப்பட்டது
    - என் பணத்தின் மீது லியன் பிடி ஏன் போடப்பட்டது
    - கடன் நிலுவை தொடர்பான சட்ட அறிவிப்பு
    - கடன் முடிந்ததற்கான அதிகாரப்பூர்வ சான்றிதழ் கோருங்கள்
    - குறைதீர்ப்பாளர் புகார் நிலையை கண்காணிக்கவும்
